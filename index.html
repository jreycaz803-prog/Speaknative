
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak Native Master - All-in-One</title>
    
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-in { animation: slideInRight 0.3s ease-out forwards; }
        .animate-zoom-in { animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        body {
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <!-- Load React and Babel via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons (as a script for easy usage) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONSTANTS ---
        const PHRASES = [
            { id: 1, standard: "I'm ready", native: "I'm all set" },
            { id: 2, standard: "I don't care", native: "Whatever" },
            { id: 3, standard: "I understand", native: "Got it" },
            { id: 4, standard: "I'm sad", native: "I'm down" },
            { id: 5, standard: "I don't know", native: "No idea" },
            { id: 6, standard: "I'm listening", native: "I'm all ears" },
            { id: 7, standard: "I'm okay", native: "Can't complain" },
            { id: 8, standard: "I need help", native: "Give me a hand" },
            { id: 9, standard: "I'll try", native: "I'll give it a shot" },
            { id: 10, standard: "I will do it", native: "I'm on it" },
            { id: 11, standard: "Let me know", native: "Keep me posted" },
            { id: 12, standard: "I like it a lot", native: "I'm really into it" },
            { id: 13, standard: "Be careful", native: "Watch out" },
            { id: 14, standard: "It's expensive", native: "It costs a fortune" }
        ];

        // --- COMPONENTS ---

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const ProgressBar = ({ current, total }) => {
            const percentage = (current / total) * 100;
            return (
                <div className="space-y-2 mb-8">
                    <div className="flex justify-between items-end px-1">
                        <span className="text-slate-400 text-xs font-bold tracking-widest uppercase">Progress</span>
                        <span className="text-slate-900 text-sm font-black">{current} <span className="text-slate-300">/ {total}</span></span>
                    </div>
                    <div className="h-3 w-full bg-slate-200 rounded-full overflow-hidden">
                        <div 
                            className="h-full bg-indigo-500 rounded-full transition-all duration-500 ease-out shadow-[0_0_10px_rgba(99,102,241,0.3)]"
                            style={{ width: `${percentage}%` }}
                        />
                    </div>
                </div>
            );
        };

        const StudyView = ({ phrases }) => {
            const speak = (text) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            };

            return (
                <div className="space-y-8 animate-fade-in">
                    <div className="text-center space-y-2">
                        <h2 className="text-3xl font-black text-slate-900 font-outfit">Speak Like a Native</h2>
                        <p className="text-slate-500 max-w-lg mx-auto">
                            Common English expressions vs. what native speakers actually say.
                        </p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {phrases.map((phrase) => (
                            <div key={phrase.id} className="group bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:border-indigo-200 hover:shadow-md transition-all flex items-center justify-between">
                                <div className="space-y-1">
                                    <p className="text-xs font-medium text-slate-400 uppercase tracking-wider">Basic</p>
                                    <p className="text-lg font-semibold text-slate-800">{phrase.standard}</p>
                                </div>
                                <div className="px-3 text-slate-300"><Icon name="arrow-right" /></div>
                                <div className="text-right space-y-1 flex-1">
                                    <p className="text-xs font-medium text-indigo-400 uppercase tracking-wider">Native</p>
                                    <div className="flex items-center justify-end gap-2">
                                        <p className="text-lg font-bold text-indigo-600">{phrase.native}</p>
                                        <button onClick={() => speak(phrase.native)} className="p-1.5 rounded-full hover:bg-indigo-50 text-indigo-400 hover:text-indigo-600 transition-colors">
                                            <Icon name="volume-2" size={18} />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const FillBlanksQuiz = ({ phrase, currentIndex, total, onNext }) => {
            const [val, setVal] = useState('');
            const [done, setDone] = useState(false);
            const [correct, setCorrect] = useState(false);

            useEffect(() => { setVal(''); setDone(false); }, [phrase]);

            const submit = (e) => {
                e.preventDefault();
                if (!val.trim() || done) return;
                const isOk = val.trim().toLowerCase().replace(/['’]/g, "'") === phrase.native.toLowerCase().replace(/['’]/g, "'");
                setCorrect(isOk);
                setDone(true);
            };

            return (
                <div className="max-w-xl mx-auto animate-slide-in">
                    <ProgressBar current={currentIndex} total={total} />
                    <div className="bg-white rounded-3xl p-8 shadow-xl border border-slate-100 space-y-8">
                        <div className="text-center space-y-2">
                            <p className="text-slate-400 font-semibold tracking-widest uppercase text-xs">Translate to Native</p>
                            <h3 className="text-3xl font-extrabold text-slate-800 font-outfit">"{phrase.standard}"</h3>
                        </div>
                        <form onSubmit={submit} className="space-y-6">
                            <input
                                autoFocus
                                type="text"
                                value={val}
                                onChange={(e) => setVal(e.target.value)}
                                disabled={done}
                                placeholder="Type here..."
                                className={`w-full text-center py-4 px-6 text-xl font-bold rounded-2xl border-2 outline-none transition-all ${
                                    done ? (correct ? 'border-green-500 bg-green-50 text-green-700' : 'border-red-500 bg-red-50 text-red-700') : 'border-slate-200 focus:border-indigo-500 bg-slate-50'
                                }`}
                            />
                            {!done ? (
                                <button type="submit" disabled={!val.trim()} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-lg shadow-lg disabled:opacity-50">Check</button>
                            ) : (
                                <div className="space-y-4">
                                    {!correct && <p className="text-center text-slate-600">Correct: <span className="text-indigo-600 font-bold">"{phrase.native}"</span></p>}
                                    <button type="button" onClick={() => onNext(correct, val)} className="w-full py-4 bg-slate-800 text-white rounded-2xl font-bold text-lg flex items-center justify-center gap-2">Next <Icon name="arrow-right" /></button>
                                </div>
                            )}
                        </form>
                    </div>
                </div>
            );
        };

        const SelectionQuiz = ({ phrase, allPhrases, currentIndex, total, onNext }) => {
            const [selected, setSelected] = useState(null);
            const [done, setDone] = useState(false);

            const options = useMemo(() => {
                const distractors = allPhrases.filter(p => p.id !== phrase.id).sort(() => 0.5 - Math.random()).slice(0, 3).map(p => p.native);
                return [...distractors, phrase.native].sort(() => 0.5 - Math.random());
            }, [phrase.id]);

            useEffect(() => { setSelected(null); setDone(false); }, [phrase]);

            const handleSelect = (opt) => {
                if (done) return;
                setSelected(opt);
                setDone(true);
            };

            return (
                <div className="max-w-xl mx-auto animate-slide-in">
                    <ProgressBar current={currentIndex} total={total} />
                    <div className="bg-white rounded-3xl p-8 shadow-xl border border-slate-100 space-y-8">
                        <div className="text-center space-y-2">
                            <p className="text-slate-400 font-semibold tracking-widest uppercase text-xs">Pick the native way</p>
                            <h3 className="text-3xl font-extrabold text-slate-800 font-outfit">"{phrase.standard}"</h3>
                        </div>
                        <div className="grid grid-cols-1 gap-3">
                            {options.map((opt, i) => (
                                <button key={i} onClick={() => handleSelect(opt)} disabled={done} className={`w-full p-4 text-left rounded-2xl border-2 font-bold text-lg transition-all ${
                                    !done ? 'border-slate-100 bg-slate-50 hover:border-indigo-300' : (opt === phrase.native ? 'border-green-500 bg-green-50 text-green-700' : (opt === selected ? 'border-red-500 bg-red-50 text-red-700' : 'opacity-40'))
                                }`}>{opt}</button>
                            ))}
                        </div>
                        {done && <button onClick={() => onNext(selected === phrase.native, selected)} className="w-full py-4 bg-slate-800 text-white rounded-2xl font-bold text-lg">Continue</button>}
                    </div>
                </div>
            );
        };

        const ResultsView = ({ score, total, onReset }) => {
            const per = Math.round((score / total) * 100);
            return (
                <div className="max-w-xl mx-auto text-center space-y-12 animate-zoom-in py-8">
                    <div className="w-32 h-32 bg-indigo-600 rounded-3xl flex items-center justify-center text-white mx-auto shadow-2xl rotate-6">
                        <Icon name="trophy" size={64} />
                    </div>
                    <div className="space-y-2">
                        <h2 className="text-4xl font-black text-slate-900 font-outfit">{per >= 80 ? 'Excellent!' : 'Good effort!'}</h2>
                        <p className="text-slate-500 text-lg">You scored {score} out of {total} ({per}%)</p>
                    </div>
                    <div className="flex flex-col gap-3">
                        <button onClick={onReset} className="w-full py-5 bg-indigo-600 text-white rounded-2xl font-bold text-xl shadow-xl flex items-center justify-center gap-3"><Icon name="refresh-ccw" /> Try Again</button>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---

        const App = () => {
            const [tab, setTab] = useState('STUDY');
            const [state, setState] = useState({ step: 0, score: 0, finished: false });

            const reset = (t) => {
                setTab(t);
                setState({ step: 0, score: 0, finished: false });
            };

            const next = (correct) => {
                const isLast = state.step === PHRASES.length - 1;
                setState(prev => ({
                    step: prev.step + 1,
                    score: correct ? prev.score + 1 : prev.score,
                    finished: isLast
                }));
            };

            const render = () => {
                if (state.finished) return <ResultsView score={state.score} total={PHRASES.length} onReset={() => reset('STUDY')} />;
                if (tab === 'STUDY') return <StudyView phrases={PHRASES} />;
                if (tab === 'FILL') return <FillBlanksQuiz phrase={PHRASES[state.step]} currentIndex={state.step} total={PHRASES.length} onNext={next} />;
                if (tab === 'SELECT') return <SelectionQuiz phrase={PHRASES[state.step]} allPhrases={PHRASES} currentIndex={state.step} total={PHRASES.length} onNext={next} />;
                return null;
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-10 p-4">
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => reset('STUDY')}>
                                <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white"><Icon name="book" /></div>
                                <h1 className="text-xl font-black text-slate-800 font-outfit hidden sm:block">SpeakNative</h1>
                            </div>
                            <nav className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                                <button onClick={() => reset('STUDY')} className={`px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 ${tab === 'STUDY' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}`}><Icon name="book-open" size={16} /> <span className="hidden md:inline">Study</span></button>
                                <button onClick={() => reset('FILL')} className={`px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 ${tab === 'FILL' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}`}><Icon name="edit-3" size={16} /> <span className="hidden md:inline">Fill</span></button>
                                <button onClick={() => reset('SELECT')} className={`px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 ${tab === 'SELECT' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}`}><Icon name="check-circle" size={16} /> <span className="hidden md:inline">Select</span></button>
                            </nav>
                        </div>
                    </header>
                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 md:p-8">
                        {render()}
                    </main>
                    <footer className="p-4 text-center text-slate-400 text-xs border-t bg-white">
                        Master natural English expressions in one place.
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
